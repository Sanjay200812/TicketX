<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090e"/>
      <stop offset="100%" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#0f0f16"/>
    </linearGradient>
    <linearGradient id="accentRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" fill="url(#archBg)" rx="16" stroke="#27272a" stroke-width="1.5"/>

  <!-- Title -->
  <text x="500" y="45" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" letter-spacing="2">
    TICKETX ARCHITECTURE &amp; DATA FLOW
  </text>
  <text x="500" y="68" text-anchor="middle" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">
    Normalized Location Discovery • Real-Time Seat Holds • Digital Pass Generation
  </text>

  <!-- Layer 1: Client Application (Top Left) -->
  <g transform="translate(50, 100)">
    <rect width="410" height="150" fill="url(#cardBg)" rx="12" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="0" width="410" height="34" fill="#1e1e2d" rx="12"/>
    <rect x="0" y="24" width="410" height="10" fill="#1e1e2d"/>
    <text x="20" y="22" fill="url(#accentBlue)" font-family="sans-serif" font-size="13" font-weight="800">1. PRESENTATION LAYER (Next.js 14 App Router)</text>

    <text x="20" y="60" fill="#e4e4e7" font-family="sans-serif" font-size="11">• Responsive Cinema &amp; Event Layout Engine</text>
    <text x="20" y="80" fill="#e4e4e7" font-family="sans-serif" font-size="11">• Interactive Seat Selector (Silver • Gold • Luxury)</text>
    <text x="20" y="100" fill="#e4e4e7" font-family="sans-serif" font-size="11">• Framer Motion Transitions &amp; Modals</text>
    <text x="20" y="120" fill="#e4e4e7" font-family="sans-serif" font-size="11">• Ticket Pass QR Code &amp; Native Web Share</text>
  </g>

  <!-- Layer 2: Location & Discovery Engine (Top Right) -->
  <g transform="translate(540, 100)">
    <rect width="410" height="150" fill="url(#cardBg)" rx="12" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="0" width="410" height="34" fill="#1e1e2d" rx="12"/>
    <rect x="0" y="24" width="410" height="10" fill="#1e1e2d"/>
    <text x="20" y="22" fill="url(#accentEmerald)" font-family="sans-serif" font-size="13" font-weight="800">2. LOCATION &amp; DISCOVERY ENGINE</text>

    <text x="20" y="60" fill="#e4e4e7" font-family="sans-serif" font-size="11">• Browser Geolocation API Reverse Resolution</text>
    <text x="20" y="80" fill="#e4e4e7" font-family="sans-serif" font-size="11">• 6-Digit Indian PIN Code Lookup Database</text>
    <text x="20" y="100" fill="#e4e4e7" font-family="sans-serif" font-size="11">• Multi-Location Saved List Context</text>
    <text x="20" y="120" fill="#e4e4e7" font-family="sans-serif" font-size="11">• Zero Cross-City Showtime Leakage Scoping</text>
  </g>

  <!-- Connectors from Top to Bottom -->
  <path d="M 255 250 L 255 295" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 745 250 L 745 295" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Layer 3: Server Seat Protection Engine (Bottom Left) -->
  <g transform="translate(50, 300)">
    <rect width="410" height="150" fill="url(#cardBg)" rx="12" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="0" width="410" height="34" fill="#1e1e2d" rx="12"/>
    <rect x="0" y="24" width="410" height="10" fill="#1e1e2d"/>
    <text x="20" y="22" fill="url(#accentRed)" font-family="sans-serif" font-size="13" font-weight="800">3. REAL-TIME SEAT PROTECTION STORE</text>

    <text x="20" y="60" fill="#e4e4e7" font-family="sans-serif" font-size="11">• Atomic Race Condition Locking (/api/seats/hold)</text>
    <text x="20" y="80" fill="#e4e4e7" font-family="sans-serif" font-size="11">• 10-Minute Active Checkout Hold Engine</text>
    <text x="20" y="100" fill="#e4e4e7" font-family="sans-serif" font-size="11">• 5-Minute Abandoned Grace Period Release</text>
    <text x="20" y="120" fill="#e4e4e7" font-family="sans-serif" font-size="11">• 2-Second Multi-User Realtime Polling Sync</text>
  </g>

  <!-- Layer 4: Checkout, Pricing & Pass Engine (Bottom Right) -->
  <g transform="translate(540, 300)">
    <rect width="410" height="150" fill="url(#cardBg)" rx="12" stroke="#374151" stroke-width="1"/>
    <rect x="0" y="0" width="410" height="34" fill="#1e1e2d" rx="12"/>
    <rect x="0" y="24" width="410" height="10" fill="#1e1e2d"/>
    <text x="20" y="22" fill="url(#accentAmber)" font-family="sans-serif" font-size="13" font-weight="800">4. CHECKOUT &amp; PASS ENGINE</text>

    <text x="20" y="60" fill="#e4e4e7" font-family="sans-serif" font-size="11">• Itemized Pricing (₹69 Booking Fee + 18% GST)</text>
    <text x="20" y="80" fill="#e4e4e7" font-family="sans-serif" font-size="11">• Client-Side HTML/Canvas PDF Pass Download</text>
    <text x="20" y="100" fill="#e4e4e7" font-family="sans-serif" font-size="11">• Soft Delete Booking Management (deleted_at)</text>
    <text x="20" y="120" fill="#e4e4e7" font-family="sans-serif" font-size="11">• Auth State Sync (Google OAuth, Phone OTP, Email)</text>
  </g>

  <!-- Horizontal Inter-Layer Connector -->
  <path d="M 460 375 L 540 375" stroke="#e11d48" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="500" cy="375" r="4" fill="#e11d48"/>
</svg>
