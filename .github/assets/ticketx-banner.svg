<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080c"/>
      <stop offset="50%" stop-color="#121218"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>

    <!-- Red Glow Gradient -->
    <radialGradient id="redGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#9f1239" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <!-- Ticket Cutout Pattern Pattern -->
    <linearGradient id="redBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#374151" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Base Card Container -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="24"/>
  <rect width="1200" height="420" fill="url(#redGlow)" rx="24"/>
  <rect x="1" y="1" width="1198" height="418" fill="none" stroke="url(#borderGrad)" stroke-width="2" rx="23"/>

  <!-- Decorative Cinema Spotlight Beams -->
  <polygon points="150,0 250,0 500,420 0,420" fill="#ffffff" opacity="0.015"/>
  <polygon points="1050,0 950,0 700,420 1200,420" fill="#ffffff" opacity="0.015"/>

  <!-- Cinema Stage Screen Beam Curve -->
  <path d="M 200 420 Q 600 370 1000 420 L 1000 420 L 200 420 Z" fill="#e11d48" opacity="0.15"/>
  <path d="M 200 420 Q 600 370 1000 420" stroke="#e11d48" stroke-width="3" fill="none" opacity="0.8"/>

  <!-- Side Ticket Stub Perforations -->
  <circle cx="0" cy="210" r="16" fill="#09090d"/>
  <circle cx="1200" cy="210" r="16" fill="#09090d"/>

  <line x1="45" y1="50" x2="45" y2="370" stroke="#27272a" stroke-width="2" stroke-dasharray="8 8"/>
  <line x1="1155" y1="50" x2="1155" y2="370" stroke="#27272a" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Top Cinema Tag Badge -->
  <g transform="translate(600, 75)">
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#18181b" stroke="#e11d48" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="0" y="5" text-anchor="middle" fill="#e11d48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="3">
      ★ NEXT-GEN CINEMA &amp; EVENTS ★
    </text>
  </g>

  <!-- Main Wordmark: TICKETX -->
  <g transform="translate(600, 190)">
    <!-- Drop Shadow Text -->
    <text x="3" y="3" text-anchor="middle" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" letter-spacing="14" opacity="0.8">
      TICKETX
    </text>
    <!-- Foreground Text -->
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="88" font-weight="900" letter-spacing="14">
      TICKET<tspan fill="#e11d48">X</tspan>
    </text>
  </g>

  <!-- Tagline Text -->
  <text x="600" y="245" text-anchor="middle" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" letter-spacing="6">
    BOOK • WATCH • EXPERIENCE
  </text>

  <text x="600" y="285" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" letter-spacing="1.5" opacity="0.85">
    Premium Location-Aware Movie Showtimes, Interactive Seating &amp; Real-Time Reservations
  </text>

  <!-- Bottom Tech Badges Pill Row -->
  <g transform="translate(600, 350)">
    <!-- Badge 1: Next.js 14 -->
    <g transform="translate(-240, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#f4f4f5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Next.js 14 App Router</text>
    </g>

    <!-- Badge 2: Realtime Seat Engine -->
    <g transform="translate(-70, 0)">
      <rect x="-75" y="-14" width="150" height="28" rx="8" fill="#18181b" stroke="#e11d48" stroke-opacity="0.4" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#e11d48" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Realtime Seat Holds</text>
    </g>

    <!-- Badge 3: Multi-City Location -->
    <g transform="translate(100, 0)">
      <rect x="-65" y="-14" width="130" height="28" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#10b981" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">Location Discovery</text>
    </g>

    <!-- Badge 4: Digital Passes -->
    <g transform="translate(240, 0)">
      <rect x="-55" y="-14" width="110" height="28" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
      <text x="0" y="4" text-anchor="middle" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700">PDF &amp; QR Passes</text>
    </g>
  </g>
</svg>
